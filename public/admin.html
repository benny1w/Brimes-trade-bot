<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot Admin</title>
<style>
  :root { --bg:#0f1720; --card:#17212c; --line:#26343f; --text:#e8eef3; --muted:#8fa1b0; --accent:#2f9bff; --danger:#ff5d5d; --ok:#34c77b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui,sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); padding:12px 16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; flex:1; }
  .muted { color:var(--muted); font-size:13px; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  .card.start { border-color:var(--accent); }
  .row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  input, textarea, select { width:100%; background:#0f1720; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px; font:inherit; }
  textarea { min-height:110px; resize:vertical; }
  button { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font:inherit; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button.danger { color:var(--danger); }
  .stepid { font-weight:700; font-size:16px; }
  .badge { font-size:11px; background:var(--accent); color:#fff; border-radius:20px; padding:2px 8px; margin-left:6px; }
  .btn-row { display:grid; grid-template-columns: 1.2fr 0.8fr 1.2fr auto; gap:6px; margin-bottom:6px; }
  .btn-row input, .btn-row select { padding:7px; }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); padding:10px 16px; border-radius:8px; background:var(--ok); color:#06210f; font-weight:600; display:none; max-width:90%; }
  #toast.err { background:var(--danger); color:#fff; }
  .then-row { display:flex; flex-direction:column; gap:4px; margin:-2px 0 10px 10px; padding-left:10px; border-left:2px solid var(--accent); }
  .fu { border:1px dashed var(--line); border-radius:10px; padding:10px; margin:8px 0; }
  .fu-top { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:8px; }
  .fu-top .num { width:72px; padding:7px; }
  .fu-top .unit { width:104px; padding:7px; }
  .fu textarea { min-height:80px; }
  .fu .var { display:flex; gap:6px; align-items:flex-start; margin:6px 0; }
  .fu .var textarea { min-height:64px; }
  .fu label.chk { display:flex; align-items:center; gap:6px; margin:0; color:var(--text); font-size:13px; }
  .fu label.chk input { width:auto; }
  .fu button[data-act="addvar"] { margin-top:6px; }
  .hint { font-size:12px; color:var(--muted); margin-top:4px; }
</style>
</head>
<body>
<header>
  <h1><a id="back" href="/" style="display:none;color:var(--accent);text-decoration:none;font-weight:400">← Customers</a> <span id="who">🤖 Bot Admin</span> <span class="muted" id="stats"></span></h1>
  <button id="addStep">+ New step</button>
  <button class="primary" id="save">Save changes</button>
</header>
<main>
  <p class="muted" id="navhint" style="display:none"></p>
  <p class="muted">Every step is one message the bot sends. Buttons either go to another step or open a link. Changes go live as soon as you save, no restart needed.</p>
  <div id="steps"></div>
</main>
<div id="toast"></div>

<script>
let data = { start: '', steps: {} };
let dirty = false; // unsaved changes on this page
let me = null;
const myId = (location.pathname.match(/^\/c\/([a-z0-9-]+)\//) || [])[1];
const $ = (s) => document.querySelector(s);

function toast(msg, isErr) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = isErr ? 'err' : '';
  t.style.display = 'block';
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => (t.style.display = 'none'), isErr ? 5000 : 2200);
}

async function load() {
  data = await (await fetch('api/steps')).json();
  const s = await (await fetch('api/stats')).json();
  $('#stats').textContent = `· ${s.users} user${s.users === 1 ? '' : 's'} · ${s.pending || 0} reminder${s.pending === 1 ? '' : 's'} waiting`;
  render();
}

function stepOptions(selected) {
  const items = Object.entries(data.steps)
    .map(([id, s]) => {
      const preview = s.text.replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim().slice(0, 28);
      return `<option value="${id}" ${id === selected ? 'selected' : ''}>${esc(id)} — ${esc(preview)}</option>`;
    })
    .join('');
  return items + '<option value="__new__">➕ Create new step...</option>';
}

function followupsHtml(step) {
  const rows = (step.followups || [])
    .map(
      (f, j) => `
    <div class="fu">
      <div class="fu-top">
        <span class="muted">Send after</span>
        <input class="num" type="number" min="0" step="any" data-f="fu-after" data-j="${j}" value="${esc(f.after)}">
        <span class="muted">to</span>
        <input class="num" type="number" min="0" step="any" data-f="fu-afterMax" data-j="${j}" placeholder="same" value="${esc(f.afterMax || '')}">
        <select class="unit" data-f="fu-unit" data-j="${j}">
          ${['minutes', 'hours', 'days'].map((u) => `<option value="${u}" ${f.unit === u ? 'selected' : ''}>${u}</option>`).join('')}
        </select>
        <button class="danger" data-act="delfu" data-j="${j}">✕</button>
      </div>
      <div class="fu-top">
        <span class="muted">Repeat</span>
        <input class="num" type="number" min="0" max="20" step="1" data-f="fu-repeat" data-j="${j}" value="${esc(f.repeat || 0)}" ${f.forever ? 'disabled' : ''}>
        <span class="muted">more times</span>
        <label class="chk"><input type="checkbox" data-f="fu-forever" data-j="${j}" ${f.forever ? 'checked' : ''}> keep repeating until they continue</label>
      </div>
      <textarea data-f="fu-text" data-j="${j}" placeholder="Follow-up message...">${esc(f.text)}</textarea>
      ${(f.variants || [])
        .map(
          (v, vi) => `<div class="var">
        <textarea data-f="fu-var" data-j="${j}" data-v="${vi}" placeholder="Another version of this message...">${esc(v)}</textarea>
        <button class="danger" data-act="delvar" data-j="${j}" data-v="${vi}">✕</button>
      </div>`
        )
        .join('')}
      <button data-act="addvar" data-j="${j}">+ Add another version (picked at random)</button>
    </div>`
    )
    .join('');
  return `<label>Follow-ups (reminders)</label>
    <div class="hint">Sent if the person hasn't moved on. They stop as soon as the person taps a button that goes to another step, or if they block the bot. The step's buttons are attached so they can continue.<br>
    <b>Send after</b>: fill only the first time for a fixed wait, or fill "to" as well for a random wait between the two (e.g. 1 to 3 hours).<br>
    <b>Repeat</b>: sends again after the same kind of wait, e.g. 1 hour with repeat 2 = three messages. Tick "keep repeating" to go on until they continue (at least 5 minutes between messages).<br>
    <b>Extra versions</b>: each time, one version is picked at random, never the same one twice in a row.</div>
    ${rows}
    <button data-act="addfu">+ Add follow-up</button>`;
}

function thenOptions(selected) {
  const items = Object.entries(data.steps)
    .map(([id, s]) => {
      const preview = s.text.replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim().slice(0, 28);
      return `<option value="${id}" ${id === selected ? 'selected' : ''}>${esc(id)} — ${esc(preview)}</option>`;
    })
    .join('');
  return `<option value="" ${!selected ? 'selected' : ''}>Nothing (just open the link)</option>` + items + '<option value="__new__">➕ Create new step...</option>';
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function render() {
  const wrap = $('#steps');
  wrap.innerHTML = '';
  Object.entries(data.steps).forEach(([id, step]) => {
    const card = document.createElement('div');
    card.className = 'card' + (id === data.start ? ' start' : '');
    const btns = (step.buttons || [])
      .map((b, i) => {
        const isLink = !!b.url;
        return `<div class="btn-row">
          <input data-f="label" data-i="${i}" placeholder="Button text" value="${esc(b.label)}">
          <select data-f="kind" data-i="${i}">
            <option value="goto" ${!isLink ? 'selected' : ''}>Go to step</option>
            <option value="url" ${isLink ? 'selected' : ''}>Open link</option>
          </select>
          ${isLink
            ? `<input data-f="url" data-i="${i}" placeholder="https://..." value="${esc(b.url)}">`
            : `<select data-f="goto" data-i="${i}">${stepOptions(b.goto)}</select>`}
          <button class="danger" data-act="delbtn" data-i="${i}">✕</button>
        </div>` + (isLink
          ? `<div class="then-row">
          <span class="muted">↳ After they tap this link, also send:</span>
          <select data-f="then" data-i="${i}">${thenOptions(b.then)}</select>
        </div>`
          : '');
      })
      .join('');
    card.innerHTML = `
      <div class="row">
        <div class="stepid" style="flex:1">${esc(id)}${id === data.start ? '<span class="badge">START</span>' : ''}</div>
        ${id !== data.start ? '<button data-act="setstart">Make start</button>' : ''}
        ${Object.keys(data.steps).length > 1 ? '<button class="danger" data-act="delstep">Delete</button>' : ''}
      </div>
      <label>Message text</label>
      <textarea data-f="text">${esc(step.text)}</textarea>
      <div class="hint">Use {name} for the person's first name. Bold: &lt;b&gt;text&lt;/b&gt; · Italic: &lt;i&gt;text&lt;/i&gt;</div>
      <label>Image link (optional, sent before the message)</label>
      <input data-f="image" placeholder="https://..." value="${esc(step.image || '')}">
      <label>Buttons</label>
      ${btns}
      <button data-act="addbtn">+ Add button</button>
      ${followupsHtml(step)}`;
    card.dataset.id = id;
    wrap.appendChild(card);
  });
}

$('#steps').addEventListener('input', (e) => {
  const card = e.target.closest('.card');
  if (!card) return;
  const step = data.steps[card.dataset.id];
  const f = e.target.dataset.f;
  const i = e.target.dataset.i;
  if (f === 'text' || f === 'image') step[f] = e.target.value;
  else if (f && f.startsWith('fu-')) {
    const fu = (step.followups || [])[+e.target.dataset.j];
    if (!fu) return;
    if (f === 'fu-after') fu.after = e.target.value === '' ? '' : Number(e.target.value);
    if (f === 'fu-afterMax') {
      if (e.target.value === '') delete fu.afterMax;
      else fu.afterMax = Number(e.target.value);
    }
    if (f === 'fu-forever') fu.forever = e.target.checked;
    if (f === 'fu-var') {
      fu.variants = fu.variants || [];
      fu.variants[+e.target.dataset.v] = e.target.value;
    }
    if (f === 'fu-unit') fu.unit = e.target.value;
    if (f === 'fu-repeat') fu.repeat = Number(e.target.value) || 0;
    if (f === 'fu-text') fu.text = e.target.value;
  } else if (i !== undefined) {
    const b = step.buttons[i];
    if (f === 'label') b.label = e.target.value;
    if (f === 'url') b.url = e.target.value;
    if (f === 'goto' && e.target.value !== '__new__') b.goto = e.target.value;
    if (f === 'then' && e.target.value !== '__new__') {
      if (e.target.value) b.then = e.target.value;
      else delete b.then;
    }
  }
});

$('#steps').addEventListener('change', (e) => {
  const card = e.target.closest('.card');
  if (card && (e.target.dataset.f === 'goto' || e.target.dataset.f === 'then') && e.target.value === '__new__') {
    const field = e.target.dataset.f;
    const b = data.steps[card.dataset.id].buttons[e.target.dataset.i];
    const raw = prompt('ID for the new step (lowercase letters, numbers, - or _). Example: buy_btc');
    const id = raw ? raw.trim().toLowerCase() : '';
    if (!id) return render();
    if (!/^[a-z0-9_-]{1,40}$/.test(id)) { toast('Use only lowercase letters, numbers, - and _.', true); return render(); }
    if (data.steps[id]) { toast('That ID already exists.', true); return render(); }
    data.steps[id] = { text: 'New message', image: '', buttons: [{ label: '🏠 Main menu', goto: data.start }] };
    b[field] = id;
    render();
    toast(`Step "${id}" created and linked. Scroll down to write its message.`);
    return;
  }
  if (card && e.target.dataset.f === 'fu-forever') return render(); // greys out the "repeat" number when ticked
  if (!card || e.target.dataset.f !== 'kind') return;
  const b = data.steps[card.dataset.id].buttons[e.target.dataset.i];
  if (e.target.value === 'url') { delete b.goto; b.url = 'https://'; }
  else { delete b.url; delete b.then; b.goto = Object.keys(data.steps)[0]; }
  render();
});

$('#steps').addEventListener('click', (e) => {
  const act = e.target.dataset.act;
  if (!act) return;
  dirty = true;
  const card = e.target.closest('.card');
  const id = card.dataset.id;
  const step = data.steps[id];
  if (act === 'addfu') {
    step.followups = step.followups || [];
    step.followups.push({ after: 1, unit: 'hours', repeat: 0, text: 'Hey {name} 👋 just a reminder, tap below to continue.' });
  } else if (act === 'delfu') {
    step.followups.splice(+e.target.dataset.j, 1);
  } else if (act === 'addvar') {
    const fu = step.followups[+e.target.dataset.j];
    fu.variants = fu.variants || [];
    fu.variants.push('');
  } else if (act === 'delvar') {
    step.followups[+e.target.dataset.j].variants.splice(+e.target.dataset.v, 1);
  } else if (act === 'addbtn') {
    step.buttons = step.buttons || [];
    step.buttons.push({ label: 'New button', goto: data.start });
  } else if (act === 'delbtn') {
    step.buttons.splice(+e.target.dataset.i, 1);
  } else if (act === 'setstart') {
    data.start = id;
  } else if (act === 'delstep') {
    const pointing = [];
    Object.entries(data.steps).forEach(([k, s]) => {
      if (k !== id) (s.buttons || []).forEach((b) => { if (b.goto === id) pointing.push(`"${b.label}" in ${k}`); });
    });
    let msg = `Delete step "${id}"?`;
    if (pointing.length) msg += `\n\nThese buttons point to it and will be removed too:\n- ` + pointing.join('\n- ');
    if (id === data.start) msg += `\n\nThis is the START step, so another step will become the start. You can change it with "Make start".`;
    if (!confirm(msg)) return;
    delete data.steps[id];
    // Link buttons that "then send" this step keep opening their link, they just stop sending the extra step
    Object.values(data.steps).forEach((s) => (s.buttons || []).forEach((b) => { if (b.then === id) delete b.then; }));
    Object.values(data.steps).forEach((s) => { s.buttons = (s.buttons || []).filter((b) => b.goto !== id); });
    if (id === data.start) data.start = Object.keys(data.steps)[0];
    toast('Deleted. Tap "Save changes" to make it live.');
  }
  render();
});

$('#addStep').addEventListener('click', () => {
  const raw = prompt('Step ID (lowercase letters, numbers, - or _). Example: buy_btc');
  if (!raw) return;
  const id = raw.trim().toLowerCase();
  if (!/^[a-z0-9_-]{1,40}$/.test(id)) return toast('Use only lowercase letters, numbers, - and _.', true);
  if (data.steps[id]) return toast('That ID already exists.', true);
  data.steps[id] = { text: 'New message', image: '', buttons: [{ label: '🏠 Main menu', goto: data.start }] };
  dirty = true;
  render();
  document.querySelector(`[data-id="${id}"]`).scrollIntoView({ behavior: 'smooth' });
});

$('#save').addEventListener('click', async () => {
  const res = await fetch('api/steps', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  const out = await res.json();
  if (res.ok) { dirty = false; toast('Saved. Live now ✓'); }
  else toast(out.error || 'Save failed', true);
});

['input', 'change'].forEach((ev) => $('#steps').addEventListener(ev, () => { dirty = true; }));

// Who is this? Shows the customer's name, and lets YOU (master) swipe between customers.
async function loadMe() {
  try { me = await (await fetch('api/me')).json(); } catch (e) { return; }
  if (!me || !me.name) return;
  $('#who').textContent = '🤖 ' + me.name + (me.active ? '' : ' (paused)');
  document.title = me.name + ' · Bot Admin';
  if (me.role === 'master') {
    $('#back').style.display = 'inline';
    setupSwipe();
  }
}

function setupSwipe() {
  let list = [];
  try { list = JSON.parse(sessionStorage.getItem('customers') || '[]'); } catch (e) {}
  const idx = list.indexOf(myId);
  if (idx < 0 || list.length < 2) return;
  const hint = $('#navhint');
  hint.style.display = 'block';
  hint.textContent = `Customer ${idx + 1} of ${list.length} · swipe left or right to switch`;
  let sx = 0, sy = 0, ok = false;
  document.addEventListener('touchstart', (e) => {
    ok = !(e.target.closest && e.target.closest('input, textarea, select')); // don't hijack typing and scrolling inside boxes
    sx = e.changedTouches[0].clientX;
    sy = e.changedTouches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if (!ok) return;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) < 80 || Math.abs(dx) < Math.abs(dy) * 1.5) return; // only clear sideways swipes
    const next = dx < 0 ? idx + 1 : idx - 1;
    if (next < 0 || next >= list.length) return toast(dx < 0 ? 'That is the last customer' : 'That is the first customer');
    if (dirty && !confirm('You have unsaved changes. Leave without saving?')) return;
    location.href = '/c/' + list[next] + '/';
  }, { passive: true });
}

load();
loadMe();
</script>
</body>
</html>
